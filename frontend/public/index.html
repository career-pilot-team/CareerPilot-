<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Integration Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>body{font-family:system-ui, sans-serif; max-width:720px; margin:40px auto;}</style>
</head>
<body>
  <h1>NGINX ↔ Front ↔ Backend ↔ AI 연결 테스트</h1>
  <button id="btnApi">/api/health 호출</button>
  <pre id="outApi"></pre>
  <button id="btnAi">/ai/health 호출</button>
  <pre id="outAi"></pre>

  <script>
    const outApi = document.getElementById('outApi');
    const outAi  = document.getElementById('outAi');

    document.getElementById('btnApi').onclick = async () => {
      outApi.textContent = '요청 중...';
      try {
        const r = await fetch('/api/health');
        outApi.textContent = await r.text();
      } catch (e) { outApi.textContent = e.toString(); }
    };

    document.getElementById('btnAi').onclick = async () => {
      outAi.textContent = '요청 중...';
      try {
        const r = await fetch('/ai/health');
        outAi.textContent = await r.text();
      } catch (e) { outAi.textContent = e.toString(); }
    };
  </script>
</body>
</html>
