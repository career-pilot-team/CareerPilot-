version: "3.9"

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpw
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p1234"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ci-net

  backend:
    build:
      context: ../backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
    - ../backend/.env
    networks:
      - ci-net

networks:
  ci-net:
    driver: bridge
