#version: "3.9"

services:
  mysql:
    image: mysql:latest
    container_name: career-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpw
    ports:
      - "3307:3306"   # 내 컴퓨터 3307 → 컨테이너 3306
    volumes:
      - ../db/mysql-data:/var/lib/mysql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - career-net

  # Backend (Node.js)
  backend:
    build: ../backend        # 나중에 backend/Dockerfile 만들 예정
    container_name: career-backend
    ports:
      - "4000:4000"
    depends_on:
      - mysql
    networks:
      - career-net

  # AI Server (FastAPI)
  ai-server:
    build: ../ai-server
    container_name: career-ai
    ports:
      - "8000:8000"
    networks:
      - career-net

  # Frontend (React) - 추후 Dockerfile 작성 예정
  frontend:
    build: ../frontend       # 나중에 frontend/Dockerfile 추가해야 함
    container_name: career-frontend
    ports:
      - "3000:3000"
    networks:
      - career-net

  # Nginx
  nginx:
    image: nginx:latest
    container_name: career-nginx
    ports:
      - "80:80"
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-server
    networks:
      - career-net

networks:
  career-net:
    driver: bridge

