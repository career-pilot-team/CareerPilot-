#version: "3.9"

services:
  mysql:
    image: mysql:latest
    container_name: career-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpw
    ports:
      - "3307:3306"   # 내 컴퓨터 3307 → 컨테이너 3306
    volumes:
      - ../db/mysql-data:/var/lib/mysql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p1234"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - career-net

  # Backend (Node.js)
  backend:
    build: ../backend
    container_name: career-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../backend/.env
    networks:
      - career-net

  # AI Server (FastAPI)
  ai-server:
    build: ../ai-server
    container_name: career-ai
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo
    networks:
      - career-net

  # Frontend (React)
  frontend:
    build: ../frontend
    container_name: career-frontend
    ports:
      - "3000:3000"
    networks:
      - career-net

  # Nginx
  nginx:
    image: nginx:latest
    container_name: career-nginx
    ports:
      - "8080:80"
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-server
    networks:
      - career-net

networks:
  career-net:
    driver: bridge

